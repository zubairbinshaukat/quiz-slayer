<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0F" />
    <title>Quiz Slayer — Slay your midterms</title>
    <meta name="description" content="Quiz Slayer: fast, offline-ready MCQ practice for your university subjects. Mock exams, mistake retries, streaks and a leaderboard." />
    <link rel="canonical" href="https://quiz.zubyr.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quiz.zubyr.dev/" />
    <meta property="og:title" content="Quiz Slayer" />
    <meta property="og:description" content="Study smarter with interactive quizzes for your university subjects." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quiz Slayer" />
    <meta name="twitter:description" content="Study smarter with interactive quizzes for your university subjects." />
    <meta name="twitter:image" content="/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Quiz Slayer",
        "url": "https://quiz.zubyr.dev/",
        "description": "Fast, offline-ready MCQ practice for university subjects with mock exams, mistake retries and a leaderboard.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      // Apply the saved theme before first paint (dark-first; avoids a light/dark flash)
      try {
        var t = localStorage.getItem('quiz-theme')
        if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F4EE')
        }
      } catch (e) {}
      // Splash on every full page load. Lite devices (same signals as src/lib/liteMode.ts) get a still frame.
      document.documentElement.classList.add('splash')
      try {
        var lp = localStorage.getItem('qs-lite-mode'), n = navigator
        if (lp === 'on' || (lp !== 'off' && (matchMedia('(prefers-reduced-motion: reduce)').matches ||
          (n.connection && n.connection.saveData) || n.deviceMemory <= 2 || (n.hardwareConcurrency > 0 && n.hardwareConcurrency <= 4))))
          document.documentElement.classList.add('splash-still')
      } catch (e) {}
    </script>
    <style>
      /* Splash. Inline so it paints with the first byte of HTML, before any JS or CSS file
         arrives; src/lib/splash.ts flies the logo into the navbar once the app has rendered. */
      #splash { display: none; }
      html.splash #splash {
        position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center;
        /* Fail-safe if the app never boots. !important + id: the lite / reduced-motion resets in index.css zero all delays */
        animation: s-out 0.5s ease 12s forwards !important;
      }
      html.splash header .logo-mark, html.splash aside .logo-mark { visibility: hidden; }
      .s-bg { position: absolute; inset: 0; background: #0b0b0f; }
      html:not(.dark) .s-bg { background: #f6f4ee; }
      .s-stage { position: relative; display: grid; place-items: center; }
      .s-stage > * { grid-area: 1 / 1; }
      .s-glow {
        width: 320px; height: 320px; border-radius: 50%;
        background: radial-gradient(closest-side, rgb(245 183 58 / 0.3), rgb(245 183 58 / 0.08) 55%, transparent);
        animation: s-bloom 1.1s cubic-bezier(0.22, 1, 0.36, 1) both, s-breathe 2.6s ease-in-out 1.1s infinite alternate;
      }
      html:not(.dark) .s-glow { background: radial-gradient(closest-side, rgb(245 183 58 / 0.24), transparent); }
      .s-ring { width: 150px; height: 150px; border-radius: 50%; border: 1px solid rgb(245 183 58 / 0.55); opacity: 0; }
      .s-art {
        position: relative; width: 98px; height: 120px;
        /* Focus pull: starts slightly large and soft. Never smaller than its resting size, so the first
           paint stays the largest (LCP) and the sharp copy fading in later does not count again. */
        transform: scale(1.08);
        filter: blur(10px) drop-shadow(0 18px 24px rgb(0 0 0 / 0.45));
      }
      html:not(.dark) .s-art { filter: blur(10px) drop-shadow(0 16px 20px rgb(60 45 20 / 0.25)); }
      .s-art img { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* The full-resolution logo fades over the inline one as soon as it arrives */
      .s-hd { opacity: 0; transition: opacity 0.45s ease; }
      .s-hd.ok { opacity: 1; }
      /* Specular glint: a brightened copy of the logo, revealed through a moving gradient stripe */
      .s-glint {
        opacity: 0; mix-blend-mode: plus-lighter; filter: brightness(1.9) saturate(1.2);
        -webkit-mask: linear-gradient(105deg, transparent 40%, #000 50%, transparent 60%) 100% 0 / 300% 100% no-repeat;
        mask: linear-gradient(105deg, transparent 40%, #000 50%, transparent 60%) 100% 0 / 300% 100% no-repeat;
      }
      #splash.in .s-art { animation: s-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
      html:not(.dark) #splash.in .s-art { animation-name: s-in-light; }
      #splash.in .s-ring { animation: s-ring 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.32s; }
      #splash.in .s-glint { animation: s-glint 0.95s cubic-bezier(0.45, 0, 0.2, 1) 0.5s; }
      /* Replay (arriving on home inside the app, src/lib/splash.ts): the same beats, tighter */
      #splash.replay .s-art { animation-duration: 0.55s; }
      #splash.replay .s-ring { animation-duration: 0.9s; animation-delay: 0.08s; }
      #splash.replay .s-glint { animation-duration: 0.6s; animation-delay: 0.16s; }
      /* Only shows on slow connections: a hairline that says "still loading" */
      .s-bar {
        position: absolute; top: calc(50% + 104px); left: 50%; width: 56px; height: 2px; margin-left: -28px;
        border-radius: 2px; overflow: hidden; background: rgb(255 255 255 / 0.08); opacity: 0;
      }
      #splash .s-bar { animation: s-show 0.4s ease 1.8s forwards !important; }
      html:not(.dark) .s-bar { background: rgb(21 21 26 / 0.08); }
      .s-bar i {
        position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, #f5b73a, transparent);
        animation: s-scan 1.1s ease-in-out infinite;
      }
      @keyframes s-bloom { from { opacity: 0; transform: scale(0.4); } }
      @keyframes s-breathe { to { opacity: 0.72; transform: scale(1.07); } }
      @keyframes s-in {
        to { transform: none; filter: blur(0) drop-shadow(0 18px 24px rgb(0 0 0 / 0.45)); }
      }
      @keyframes s-in-light {
        to { transform: none; filter: blur(0) drop-shadow(0 16px 20px rgb(60 45 20 / 0.25)); }
      }
      @keyframes s-ring { from { opacity: 0.9; transform: scale(0.62); } to { opacity: 0; transform: scale(1.9); } }
      @keyframes s-glint {
        from { opacity: 0.6; -webkit-mask-position: 100% 0; mask-position: 100% 0; }
        to { opacity: 0.6; -webkit-mask-position: 0% 0; mask-position: 0% 0; }
      }
      @keyframes s-show { to { opacity: 1; } }
      @keyframes s-scan { to { transform: translateX(100%); } }
      @keyframes s-out { to { opacity: 0; visibility: hidden; } }
      /* Still frame: lite devices and reduced motion */
      html.splash-still .s-stage *, html.splash-still #splash.in .s-stage * { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      @media (prefers-reduced-motion: reduce) {
        .s-stage *, #splash.in .s-stage * { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="s-bg"></div>
      <div class="s-stage">
        <span class="s-glow"></span>
        <span class="s-ring"></span>
        <div class="s-fly"><div class="s-fly-y"><div class="s-art">
          <!-- data-inline: the build embeds a 160px-tall copy, so the logo paints with the HTML (LCP = FCP).
               It must be at least the size it is shown at, or Chrome counts the sharp copy as a later, larger LCP. -->
          <img class="s-base" src="/logo-3d-384.webp" data-inline="160" width="98" height="120" alt="" decoding="sync" />
          <img class="s-hd" src="/logo-3d-384.webp" srcset="/logo-3d-96.webp 78w, /logo-3d-384.webp 313w" sizes="98px" width="98" height="120" alt="" fetchpriority="low" />
          <img class="s-glint" width="98" height="120" alt="" />
        </div></div></div>
      </div>
      <span class="s-bar"><i></i></span>
    </div>
    <script>
      // Start the intro once the logo has pixels (inline in production, so straight away);
      // the sharp version cross-fades in whenever it lands
      ;(function () {
        var s = document.getElementById('splash'), base = s.querySelector('.s-base'), hd = s.querySelector('.s-hd'), glint = s.querySelector('.s-glint')
        function go() {
          if (s.classList.contains('in')) return
          glint.src = base.currentSrc || base.src
          window.__splashIn = performance.now()
          s.classList.add('in')
          if (window.__boot) window.__boot() // production: the app starts once this frame has painted
        }
        function sharp() {
          hd.classList.add('ok')
          glint.src = hd.currentSrc || hd.src
        }
        if (base.complete && base.naturalWidth) go()
        else { base.addEventListener('load', go); base.addEventListener('error', go) }
        if (hd.complete && hd.naturalWidth) sharp()
        else hd.addEventListener('load', sharp)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
