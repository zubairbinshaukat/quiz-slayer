<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0F" />
    <title>Quiz Slayer — Slay your midterms</title>
    <meta name="description" content="Quiz Slayer: fast, offline-ready MCQ practice for your university subjects. Mock exams, mistake retries, streaks and a leaderboard." />
    <link rel="canonical" href="https://quiz.zubyr.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quiz.zubyr.dev/" />
    <meta property="og:title" content="Quiz Slayer" />
    <meta property="og:description" content="Study smarter with interactive quizzes for your university subjects." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quiz Slayer" />
    <meta name="twitter:description" content="Study smarter with interactive quizzes for your university subjects." />
    <meta name="twitter:image" content="/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Quiz Slayer",
        "url": "https://quiz.zubyr.dev/",
        "description": "Fast, offline-ready MCQ practice for university subjects with mock exams, mistake retries and a leaderboard.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      // Apply the saved theme before first paint (dark-first; avoids a light/dark flash)
      try {
        var t = localStorage.getItem('quiz-theme')
        if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F4EE')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
